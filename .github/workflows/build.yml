name: CI Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate dummy keystore for CI
      run: |
        keytool -genkeypair -v -keystore limiter.jks -alias limiter -keyalg RSA -keysize 2048 -validity 10000 -storepass limiter -keypass limiter -dname "CN=Limiter, OU=Limiter, O=Limiter, L=Unknown, ST=Unknown, C=Unknown"
        echo "storeFile=limiter.jks" > keystore.properties
        echo "storePassword=limiter" >> keystore.properties
        echo "keyAlias=limiter" >> keystore.properties
        echo "keyPassword=limiter" >> keystore.properties

    - name: Build with Gradle
      run: ./gradlew assembleDebug testDebugUnitTest --stacktrace
